name: Build
on: [push, pull_request]

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      # Prepare
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          show-progress: false
      - uses: gittools/actions/gitversion/setup@v3.2.1
        with:
          versionSpec: '5.12.x'
      - uses: gittools/actions/gitversion/execute@v3.2.1
        id: gitversion

      # Build
      - name: Build
        run: src\build.ps1 ${{steps.gitversion.outputs.nuGetVersion}}
      - uses: 0install/github-actions/0template@v1
        id: feed
        with:
          template: feed/LightTag.xml.template
          version: ${{steps.gitversion.outputs.nuGetVersion}}
          args: stability=${{github.ref_type == 'tag' && 'stable' || 'developer'}}
          github-release: ${{github.ref_type == 'tag'}}

      # Release
      - name: Get tag message
        if: github.ref_type == 'tag'
        id: tag_message
        run: |
          "message<<EOF" >> $env:GITHUB_OUTPUT
          git fetch -f origin tag ${{github.ref_name}}
          git tag --format="%(contents)" -l ${{github.ref_name}} >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          body: |
            **[Zero Install feed](http://nano-byte.de/feeds/LightTag.xml)**
            ## Changes
            ${{steps.tag_message.outputs.message}}
          files: |
            ${{steps.feed.outputs.feed}}
            ${{steps.feed.outputs.archive}}
